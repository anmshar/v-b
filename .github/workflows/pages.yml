name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Let a running Pages deployment finish; superseded PR runs can be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and end-to-end test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright with Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Build site
        run: sh scripts/build-site.sh

      - name: Serve the built site under /v-b/, as GitHub Pages does
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          ln -s "$GITHUB_WORKSPACE/_site" "$RUNNER_TEMP/pages/v-b"
          python3 -m http.server 8765 --directory "$RUNNER_TEMP/pages" > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8765/v-b/index.html > /dev/null && exit 0
            sleep 1
          done
          echo "Static server did not start"; cat "$RUNNER_TEMP/server.log"; exit 1

      - name: End-to-end journey test
        run: node tests/e2e.mjs http://localhost:8765/v-b/index.html screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pages-check:
    name: Check GitHub Pages is enabled
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2> /dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            msg="GitHub Pages is not enabled yet. In Settings → Pages, set Source to 'GitHub Actions', then re-run this workflow."
            echo "::warning title=Deployment skipped::$msg"
            echo "### Deployment skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy to GitHub Pages
    needs: [test, pages-check]
    if: needs.pages-check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5

      - id: deployment
        uses: actions/deploy-pages@v4
