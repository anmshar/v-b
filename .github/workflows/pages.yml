name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Let a running Pages deployment finish; superseded PR runs can be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and end-to-end test
    # Pinned: Playwright 1.56.1 has no Chromium build for Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Playwright with Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Build site
        run: sh scripts/build-site.sh

      - name: Serve the built site under /v-b/, as GitHub Pages does
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          ln -s "$GITHUB_WORKSPACE/_site" "$RUNNER_TEMP/pages/v-b"
          python3 -m http.server 8765 --directory "$RUNNER_TEMP/pages" > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8765/v-b/index.html > /dev/null && exit 0
            sleep 1
          done
          echo "Static server did not start"; cat "$RUNNER_TEMP/server.log"; exit 1

      - name: End-to-end journey test
        run: node tests/e2e.mjs http://localhost:8765/v-b/index.html screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  pages-check:
    name: Check GitHub Pages is enabled
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          skip() {
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Deployment skipped::$1"
            printf '### Deployment skipped\n%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
          }
          if out=$(gh api "repos/$REPO/pages" --jq .build_type 2>&1); then
            if [ "$out" = "workflow" ]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
            else
              skip "GitHub Pages publishes from a branch ('$out'). In Settings → Pages, set Source to 'GitHub Actions', then re-run this workflow."
            fi
          elif printf '%s' "$out" | grep -q 'HTTP 404'; then
            skip "GitHub Pages is not enabled yet. In Settings → Pages, set Source to 'GitHub Actions', then re-run this workflow."
          else
            echo "::error title=Could not read the Pages configuration::$out"
            exit 1
          fi

  deploy:
    name: Deploy to GitHub Pages
    needs: [test, pages-check]
    if: needs.pages-check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
